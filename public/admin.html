<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Portfolio Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>

<div id="app" hidden>
<header class="topbar">
  <div class="topbar-left">
    <a class="logo" href="./" title="Open portfolio">RA</a>
    <div>
      <div class="topbar-title">Portfolio Admin</div>
      <span class="conn" id="conn-status" data-state="off">
        <span class="dot"></span><span class="conn-text">Signed out</span>
      </span>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="dirty-badge" id="dirty-badge" hidden>Unsaved changes</span>
    <button type="button" class="btn" id="btn-preview" title="Preview the draft in a new tab">Preview</button>
    <div class="menu">
      <button type="button" class="btn" id="btn-more" aria-haspopup="true" aria-expanded="false">More ▾</button>
      <div class="menu-list" id="menu-list" hidden>
        <button type="button" data-action="download">Download portfolio.json</button>
        <button type="button" data-action="import">Import portfolio.json…</button>
        <button type="button" data-action="discard">Discard local changes</button>
        <button type="button" data-action="logout">Sign out</button>
      </div>
    </div>
    <button type="button" class="btn btn-primary" id="btn-publish">Publish</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
  <main class="editor" id="editor">
    <div class="empty">Loading…</div>
  </main>
</div>
</div>

<input type="file" id="import-file" accept="application/json,.json" hidden />
<input type="file" id="photo-file" accept="image/*" hidden />

<!-- Login -->
<dialog id="login-dialog" class="dialog dialog-login">
  <form id="login-form">
    <div class="login-mark">RA</div>
    <h2>Portfolio Admin</h2>
    <p class="muted">Sign in with the admin password set in your Vercel project.</p>
    <label class="field"><span>Password</span><input name="password" type="password" required autocomplete="current-password" /></label>
    <p class="form-error" id="login-error" hidden></p>
    <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
  </form>
</dialog>

<!-- Publish dialog -->
<dialog id="publish-dialog" class="dialog">
  <form method="dialog" id="publish-form">
    <h2>Publish changes</h2>
    <p class="muted">Commits <code>data/portfolio.json</code> to GitHub. Vercel redeploys the site in about a minute.</p>
    <ul class="changes" id="publish-changes"></ul>
    <label class="field"><span>Commit message</span><input name="message" required /></label>
    <p class="form-error" id="publish-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="publish-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="publish-submit">Publish</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/admin.js"></script>
</body>
</html>
