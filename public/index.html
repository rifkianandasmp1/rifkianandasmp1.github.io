<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M. Rifki Ananda — System & Data Analyst</title>
<meta name="description" content="Portfolio of M. Rifki Ananda — System & Data Analyst with 4+ years of experience in enterprise systems, SDLC, and data-driven solutions." />
<meta name="author" content="M. Rifki Ananda" />
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />

<meta property="og:type" content="profile" />
<meta property="og:title" content="M. Rifki Ananda — System & Data Analyst" />
<meta property="og:description" content="System & Data Analyst with 4+ years delivering enterprise systems across BUMN and higher-education platforms." />
<meta property="og:image" content="https://rifkiananda.vercel.app/images/profile.png" />
<meta property="og:url" content="https://rifkiananda.vercel.app/" />
<link rel="canonical" href="https://rifkiananda.vercel.app/" />
<meta name="twitter:card" content="summary" />

<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/site.css" />

<!-- Apply saved theme before first paint to avoid a flash -->
<script>
  try {
    var t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="top">
  <div class="container header-inner">
    <a class="brand" href="#top" aria-label="Back to top">
      <span class="brand-mark" id="brand-mark">RA</span>
      <span class="brand-name" id="brand-name">M. Rifki Ananda</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#education">Education</a>
      <a href="#skills">Skills</a>
      <a href="#contact" class="nav-cta">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <div class="load-state" id="load-state" role="status">Loading portfolio…</div>

  <div id="content" hidden>
    <!-- HERO -->
    <section class="hero container">
      <div class="hero-main">
        <p class="status-pill" id="hero-status"><span class="pulse" aria-hidden="true"></span><span></span></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-role" id="hero-role"></p>
        <p class="hero-tagline" id="hero-tagline"></p>
        <div class="hero-actions" id="hero-actions"></div>
      </div>
      <figure class="hero-photo" id="hero-photo"></figure>
      <dl class="stats" id="hero-stats"></dl>
    </section>

    <!-- ABOUT -->
    <section class="section container" id="about">
      <header class="section-head reveal">
        <span class="section-index">01</span>
        <h2 class="section-title">About</h2>
      </header>
      <div class="about-grid reveal">
        <p class="about-lead" id="about-lead"></p>
        <div class="about-body" id="about-body"></div>
      </div>
      <div class="method reveal">
        <p class="eyebrow" id="method-label"></p>
        <div class="method-grid" id="method-grid"></div>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section class="section container" id="experience">
      <header class="section-head reveal">
        <span class="section-index">02</span>
        <h2 class="section-title">Experience</h2>
      </header>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <!-- PROJECTS -->
    <section class="section container" id="projects">
      <header class="section-head reveal">
        <span class="section-index">03</span>
        <h2 class="section-title">Projects</h2>
      </header>
      <div class="filters reveal" id="project-filters" role="group" aria-label="Filter projects by organization"></div>
      <div class="carousel reveal" role="region" aria-roledescription="carousel" aria-label="Projects">
        <div class="project-track" id="project-grid" tabindex="0"></div>
        <div class="carousel-nav" id="project-nav" hidden>
          <button class="icon-btn" id="project-prev" type="button" aria-label="Previous projects">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="carousel-page" id="project-page" aria-live="polite">1 / 1</span>
          <button class="icon-btn" id="project-next" type="button" aria-label="Next projects">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- EDUCATION -->
    <section class="section container" id="education">
      <header class="section-head reveal">
        <span class="section-index">04</span>
        <h2 class="section-title">Education &amp; honors</h2>
      </header>
      <div class="edu-grid" id="edu-grid"></div>
    </section>

    <!-- SKILLS -->
    <section class="section container" id="skills">
      <header class="section-head reveal">
        <span class="section-index">05</span>
        <h2 class="section-title">Skills &amp; training</h2>
      </header>
      <div class="skills-grid reveal" id="skills-grid"></div>
      <div class="training reveal">
        <p class="eyebrow">Training, webinars &amp; certifications</p>
        <ul class="training-list" id="training-list"></ul>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section container" id="contact">
      <div class="contact-card reveal">
        <span class="section-index">06</span>
        <h2 class="contact-heading" id="contact-heading"></h2>
        <p class="contact-sub" id="contact-sub"></p>
        <div class="contact-links" id="contact-links"></div>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span id="footer-copy"></span>
    <span id="footer-updated"></span>
    <a href="#top">Back to top ↑</a>
  </div>
</footer>

<noscript>
  <p class="noscript">This portfolio needs JavaScript to load its content.</p>
</noscript>

<script src="assets/js/site.js"></script>
</body>
</html>
